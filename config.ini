$ Configuration du site
$ Les lignes qui commencent par $ sont des commentaires (ignorées).

[images]
$ Photos du diaporama : 1.jpg, 2.jpg, 3.jpg...
range=1-3
$ Ou bien, à la place de range, des noms au choix :
$ list= terrain.jpg, atelier.jpg

[files]
$ Une section par fichier .md, dans l'ordre du menu.
$ Dans chaque fichier :  # Titre de section  /  ## Sous-titre  /  ### Article du blog
list= pro, parc, exp, pub, ter,  blog, cont

[site]
$ Facultatif : nom affiché, sous-titre et thème par défaut (sombre, clair ou beige)
nom= Andrianaivo Mampianina Christian
$ sous_titre= Doctorant en économie
theme= sombre
