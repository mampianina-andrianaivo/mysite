/* =====================================================================
   THÈMES : clair, beige, sombre (mêmes teintes que le logiciel éditeur)
   ===================================================================== */
:root, [data-theme="clair"] {
  --page-bg: #dfe3ea;
  --side-bg: linear-gradient(180deg, #f4f6f9 0%, #e8ebf0 100%);
  --side-border: #b9c0cb;

  --panel-border: #c3c9d3;

  --text: #1f2328;
  --muted: #5b6370;
  --title-grad: linear-gradient(180deg, #4b5566 0%, #343c49 48%, #262c36 52%, #2d3440 100%);
  --title-border: #1a1f27;
  --title-text: #ffffff;
  --btn-grad: linear-gradient(180deg, #fefefe 0%, #f2f2f2 48%, #e1e1e1 52%, #e5e5e5 100%);
  --btn-border: #707070;
  --btn-text: #000000;
  --btn-shadow: inset 0 1px 0 #ffffff, 0 1px 2px rgba(0, 0, 0, 0.08);
  --btn-hover-grad: linear-gradient(180deg, #edf6fc 0%, #d9ecf8 48%, #bee6fd 52%, #b5e1fb 100%);
  --btn-hover-border: #3c7fb1;
  --btn-press-grad: linear-gradient(180deg, #c2e4f6 0%, #a6daf5 48%, #90cff3 52%, #86c7ec 100%);
  --strong: #0f7a4a;
  --link: #1d5fb4;
  --h3: #1f2328;
  --h3-bar: #2985ea;
  --input-bg: #ffffff;
  --input-border: #8e959f;
  --excerpt: #4a525e;
  --scroll-track: #e3e6eb;
  --scroll-thumb: linear-gradient(90deg, #f4f4f4, #d4d4d4);
  --scroll-thumb-border: #9aa1ab;
  --overlay: rgba(25, 30, 40, 0.55);
}

[data-theme="beige"] {
  --page-bg: #e2d3bb;
  --side-bg: linear-gradient(180deg, #f6eee2 0%, #ecdfca 100%);
  --side-border: #b59c75;
  --panel-bg: #fbf6ee;
  --panel-border: #c7b08a;
  --panel-shadow: 0 1px 3px rgba(60, 40, 15, 0.18);
  --text: #3b2f22;
  --muted: #6f5d47;
  --title-grad: linear-gradient(180deg, #8a6b48 0%, #6e5335 48%, #5a4228 52%, #644a2e 100%);
  --title-border: #3e2c18;
  --title-text: #fffaf0;
  --btn-grad: linear-gradient(180deg, #f6eee2 0%, #f0e2ce 48%, #e7d1b2 52%, #e9d5b8 100%);
  --btn-border: #9c8462;
  --btn-text: #2b2116;
  --btn-shadow: inset 0 1px 0 #f6efe4, 0 1px 2px rgba(60, 40, 15, 0.12);
  --btn-hover-grad: linear-gradient(180deg, #f8ecd6 0%, #f1dcb6 48%, #e9c995 52%, #e4c189 100%);
  --btn-hover-border: #b07a2a;
  --btn-press-grad: linear-gradient(180deg, #ecd3a8 0%, #e2c08a 48%, #d7af70 52%, #dcb579 100%);
  --strong: #2f6b3a;
  --link: #8a4b12;
  --h3: #3b2f22;
  --h3-bar: #b07a2a;
  --input-bg: #fffdf8;
  --input-border: #a58d68;
  --excerpt: #5a4a38;
  --scroll-track: #eadcc4;
  --scroll-thumb: linear-gradient(90deg, #f6eee2, #dcc6a3);
  --scroll-thumb-border: #a58d68;
  --overlay: rgba(50, 35, 15, 0.55);
}

[data-theme="sombre"] {
  --page-bg: #121315;
  --side-bg: linear-gradient(180deg, #24262a 0%, #1b1c1f 100%);
  --side-border: #050505;
  --panel-bg: #1f2124;
  --panel-border: #373a40;
  --panel-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
  --text: #e6e6e6;
  --muted: #a3a7ae;
  --title-grad: linear-gradient(180deg, #474a51 0%, #36383e 48%, #2a2c30 52%, #303237 100%);
  --title-border: #050505;
  --title-text: #f3f3f3;
  --btn-grad: linear-gradient(180deg, #43464c 0%, #383a3f 48%, #2e3034 52%, #323438 100%);
  --btn-border: #565961;
  --btn-text: #f0f0f0;
  --btn-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 1px 2px rgba(0, 0, 0, 0.35);
  --btn-hover-grad: linear-gradient(180deg, #4f535a 0%, #43464d 48%, #393b41 52%, #3f4248 100%);
  --btn-hover-border: #4a8cd1;
  --btn-press-grad: linear-gradient(180deg, #2a2c30 0%, #26282b 48%, #222427 52%, #25272a 100%);
  --strong: #6ec493;
  --link: #8fbef5;
  --h3: #f0f0f0;
  --h3-bar: #4a8cd1;
  --input-bg: #17181a;
  --input-border: #4a4d54;
  --excerpt: #b9bdc4;
  --scroll-track: #1a1b1d;
  --scroll-thumb: linear-gradient(90deg, #4a4d53, #36383d);
  --scroll-thumb-border: #0c0c0d;
  --overlay: rgba(0, 0, 0, 0.65);
}

/* =====================================================================
   BASE
   ===================================================================== */
* { box-sizing: border-box; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100%;
  background: var(--page-bg);
  color: var(--text);
  font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.55;
  touch-action: manipulation;
}
img { max-width: 100%; height: auto; display: block; }
a { color: var(--link); }
strong { color: var(--strong); }
p { margin: 0 0 0.9rem; }
hr { border: 0; height: 2px; margin: 1.2rem 0; box-shadow: inset 0 1px 0 rgba(0, 0, 0, 0.25), inset 0 -1px 0 rgba(255, 255, 255, 0.35); }
[data-theme="sombre"] hr { box-shadow: inset 0 1px 0 rgba(0, 0, 0, 0.6), inset 0 -1px 0 rgba(255, 255, 255, 0.06); }

/* Barres de défilement en relief, comme dans l'éditeur */
::-webkit-scrollbar { width: 13px; height: 13px; }
::-webkit-scrollbar-track { background: var(--scroll-track); }
::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border: 1px solid var(--scroll-thumb-border); border-radius: 3px; }

/* =====================================================================
   BOUTONS WINDOWS 7 EN RELIEF
   ===================================================================== */
.w7-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem;
  min-height: 30px; padding: 0.3rem 0.9rem;
  font: inherit; font-size: 0.92rem; font-weight: 600; text-decoration: none;
  color: var(--btn-text);
  background: var(--btn-grad);
  border: 1px solid var(--btn-border);
  border-radius: 3px;
  box-shadow: var(--btn-shadow);
  cursor: pointer; user-select: none; -webkit-user-select: none;
}
.w7-btn:hover { background: var(--btn-hover-grad); border-color: var(--btn-hover-border); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), 0 0 4px rgba(60, 127, 177, 0.5); }
.w7-btn:active { background: var(--btn-press-grad); box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.3); }
/* Bouton principal bleu Aero (rubrique active, envoi du formulaire) */
.w7-btn.primary, button[type="submit"] {
  color: #ffffff; text-shadow: 0 1px 1px rgba(0, 0, 0, 0.4);
  background: linear-gradient(180deg, #53a3f5 0%, #2985ea 48%, #176fc8 52%, #2a87ec 100%);
  border-color: #145398;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 1px 2px rgba(0, 0, 0, 0.2);
}
.w7-btn.primary:hover, button[type="submit"]:hover {
  background: linear-gradient(180deg, #6bb3f9 0%, #3d94ee 48%, #207ddc 52%, #3d95ef 100%);
  border-color: #0d437e; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 0 5px rgba(41, 133, 234, 0.6);
}
.w7-btn.primary:active, button[type="submit"]:active {
  background: linear-gradient(180deg, #186ac5 0%, #1157a5 48%, #0f4b8d 52%, #1461b4 100%);
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
}

/* =====================================================================
   MISE EN PAGE BUREAU : colonne gauche (photos + menu), colonne droite (contenu)
   ===================================================================== */
.layout { display: flex; height: 100vh; height: 100dvh; max-width: 1400px; margin: 0 auto; }
.sidebar {
  width: 36%; max-width: 460px; flex-shrink: 0;
  display: flex; flex-direction: column; gap: 1rem;
  padding: 1.5rem 1.25rem;
  background: var(--side-bg);
  border-right: 1px solid var(--side-border);
  box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.35);
  overflow-y: auto;
}
[data-theme="sombre"] .sidebar { box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.04); }
.site-name {
  margin: 0; text-align: center; font-size: 1.05rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
}
.site-name small { display: block; font-size: 0.78rem; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); }
.menu { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.4rem; }
.menu .w7-btn { width: 100%; justify-content: flex-start; min-height: 36px; font-size: 0.98rem; }
.menu .w7-btn .num {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 1.6rem; height: 1.25rem; padding: 0 0.3rem;
  font-size: 0.72rem; font-weight: 700; border-radius: 2px;
  background: rgba(0, 0, 0, 0.12); color: inherit;
}
.menu .w7-btn.primary .num { background: rgba(255, 255, 255, 0.22); }
.themes { margin-top: auto; display: flex; gap: 0.35rem; justify-content: center; padding-top: 0.5rem; }
.themes .w7-btn { flex: 1; min-height: 28px; padding: 0.2rem 0.5rem; font-size: 0.82rem; }

.content { flex: 1; min-width: 0; overflow-y: auto; padding: 1.5rem 2rem 3rem; scroll-behavior: smooth; }

/* =====================================================================
   RUBRIQUES : fenêtre avec barre de titre en verre, comme les dialogues de l'éditeur
   ===================================================================== */
.section { margin: 0 0 1.6rem; scroll-margin-top: 1rem; }
.window {
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  box-shadow: var(--panel-shadow), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
  overflow: hidden;
}
[data-theme="sombre"] .window { box-shadow: var(--panel-shadow), inset 0 0 0 1px rgba(255, 255, 255, 0.04); }
.titlebar {
  display: flex; align-items: center; gap: 0.7rem;
  padding: 0.6rem 0.9rem;
  background: var(--title-grad);
  border-bottom: 1px solid var(--title-border);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
  color: var(--title-text);
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
}
.titlebar h2 { margin: 0; flex: 1; min-width: 0; font-size: 1rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
.titlebar .pill {
  display: inline-flex; align-items: center; justify-content: center;
  width: 1.9rem; height: 1.9rem; flex-shrink: 0;
  font-size: 0.8rem; font-weight: 800; border-radius: 4px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.06) 50%, rgba(0, 0, 0, 0.18) 100%);
  border: 1px solid rgba(255, 255, 255, 0.3);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 1px 2px rgba(0, 0, 0, 0.4);
}
.window-body {
  padding: 1.1rem 1.25rem 1.2rem;
  background-image: linear-gradient(180deg, rgba(0, 0, 0, 0.05) 0%, rgba(0, 0, 0, 0) 14px);
  overflow-wrap: anywhere;
}
[data-theme="sombre"] .window-body { background-image: linear-gradient(180deg, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0) 14px); }
.window-body:empty { display: none; }
.window-body h3 {
  margin: 1.6rem 0 0.6rem; padding: 0.15rem 0 0.15rem 0.75rem;
  font-size: 1.05rem; font-weight: 700; color: var(--h3);
  border-left: 4px solid var(--h3-bar);
}
.window-body h3:first-child { margin-top: 0.2rem; }
.window-body ul { padding-left: 1.3rem; margin: 0 0 0.9rem; }
.window-body li { margin-bottom: 0.3rem; }
.window-body img { border: 1px solid var(--panel-border); border-radius: 3px; margin: 0.8rem auto; }

/* =====================================================================
   DIAPORAMA DE PHOTOS
   ===================================================================== */
.slider { position: relative; }
.slider-frame {
  position: relative; overflow: hidden; aspect-ratio: 4 / 3;
  border: 1px solid var(--panel-border); border-radius: 4px;
  background: #000; box-shadow: var(--panel-shadow);
}
.slider-frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; margin: 0; border: 0; border-radius: 0; opacity: 0; transition: opacity 0.6s; }
.slider-frame img.active { opacity: 1; }
.slider-bar { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 0.5rem; }
.slider-bar .w7-btn { min-height: 26px; width: 30px; padding: 0; font-size: 0.9rem; }
.dots { display: flex; gap: 0.35rem; }
.dot { width: 10px; height: 10px; padding: 0; border-radius: 50%; border: 1px solid var(--btn-border); background: var(--btn-grad); cursor: pointer; }
.dot.active { background: radial-gradient(circle at 35% 30%, #bfdbfe 0%, #3b82f6 45%, #1d4ed8 100%); border-color: #1e40af; }
.mobile-slider { display: none; }

/* =====================================================================
   BLOG : une carte par article (#### Titre), ouverte dans une fenêtre
   ===================================================================== */
.blog-tiles { display: flex; flex-direction: column; gap: 0.9rem; margin-top: 1rem; }
.blog-tile {
  display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 1rem; align-items: center;
  padding: 0.9rem 1rem;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border); border-right: 4px solid var(--h3-bar);
  border-radius: 4px; box-shadow: var(--panel-shadow);
  cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%;
}
.blog-tile:hover { border-color: var(--btn-hover-border); box-shadow: var(--panel-shadow), 0 0 5px rgba(60, 127, 177, 0.45); }
.blog-tile-head { display: flex; flex-direction: column; gap: 0.4rem; min-width: 0; }
.blog-tile-title { font-size: 1.05rem; font-weight: 700; color: var(--strong); line-height: 1.3; }
.blog-tile-meta { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; font-size: 0.8rem; color: var(--muted); }
.badge {
  display: inline-block; padding: 0.05rem 0.45rem; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
  color: #fff; border-radius: 3px; text-shadow: 0 1px 1px rgba(0, 0, 0, 0.4);
  background: linear-gradient(180deg, #10b981 0%, #059669 50%, #047857 100%); border: 1px solid #065f46;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 1px 2px rgba(0, 0, 0, 0.15);
}
.badge.video { background: linear-gradient(180deg, #f87171 0%, #dc2626 50%, #b91c1c 100%); border-color: #991b1b; }
.blog-tile-excerpt { font-size: 0.92rem; color: var(--excerpt); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.blog-tile-read { justify-self: end; grid-column: 1 / -1; margin-top: -0.2rem; }

/* Fenêtre d'article */
.reader {
  position: fixed; inset: 0; z-index: 1000;
  display: none; align-items: center; justify-content: center;
  padding: 2.5vh 2vw;
  background: var(--overlay);
}
.reader.open { display: flex; }
.reader .window { width: min(920px, 100%); height: 100%; display: flex; flex-direction: column; box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45), 0 3px 8px rgba(0, 0, 0, 0.3); }
.reader .titlebar { padding-top: max(0.6rem, env(safe-area-inset-top)); }
.reader .titlebar h2 { text-transform: none; letter-spacing: 0; font-size: 1.05rem; line-height: 1.3; }
.close-btn {
  width: 34px; height: 30px; flex-shrink: 0; padding: 0;
  color: #fff; font-size: 1.1rem; font-weight: 700; line-height: 1;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.32) 0%, rgba(255, 255, 255, 0.12) 48%, rgba(0, 0, 0, 0.08) 52%, rgba(0, 0, 0, 0.18) 100%);
  border: 1px solid rgba(255, 255, 255, 0.45); border-radius: 3px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 1px 2px rgba(0, 0, 0, 0.35);
  cursor: pointer;
}
.close-btn:hover { background: linear-gradient(180deg, #f2a197 0%, #e0705f 48%, #c8402c 52%, #d2614b 100%); border-color: #6d1a10; }
.reader-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 1.2rem 1.6rem 2rem; text-align: justify; hyphens: auto; }
.reader-body img { width: min(600px, 100%); margin: 1rem auto; border: 1px solid var(--panel-border); border-radius: 3px; }
.reader-body iframe { display: block; width: min(720px, 100%); aspect-ratio: 16 / 9; height: auto; margin: 1rem auto; border: 1px solid var(--panel-border); }
.reader-body a { word-break: break-all; }
.reader-meta { display: flex; gap: 0.5rem; align-items: center; font-size: 0.85rem; color: var(--muted); margin: 0 0 1rem; }
body.reading { overflow: hidden; }

/* =====================================================================
   FORMULAIRE DE CONTACT
   ===================================================================== */
form { max-width: 600px; margin: 0.5rem auto; display: flex; flex-direction: column; gap: 0.75rem; }
input[type="text"], input[type="email"], textarea {
  width: 100%; padding: 0.55rem 0.7rem; font: inherit; font-size: 16px;
  color: var(--text); background: var(--input-bg);
  border: 1px solid var(--input-border); border-radius: 2px;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.12);
}
input:focus, textarea:focus { outline: none; border-color: #3c7fb1; box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.12), 0 0 4px rgba(60, 127, 177, 0.55); }
textarea { min-height: 180px; resize: vertical; }
button[type="submit"] { min-height: 38px; font: inherit; font-weight: 700; border: 1px solid #145398; border-radius: 3px; cursor: pointer; }

/* Avertissement visible seulement en local (fichier listé mais absent, etc.) */
.local-warning { margin: 0 0 1rem; padding: 0.7rem 0.9rem; border: 1px solid #b45309; border-left-width: 4px; border-radius: 3px; background: #fef3c7; color: #78350f; font-size: 0.9rem; }

/* =====================================================================
   MOBILE / TABLETTE ÉTROITE : barre du haut + menu déroulant, une seule colonne
   ===================================================================== */
.topbar, .drawer { display: none; }
@media (max-width: 800px) {
  .layout { display: block; height: auto; }
  .sidebar { display: none; }
  .content { overflow: visible; padding: calc(56px + 1rem) 0.75rem 2rem; }
  .section { scroll-margin-top: 64px; }
  .topbar {
    display: flex; align-items: center; gap: 0.5rem;
    position: fixed; top: 0; left: 0; right: 0; z-index: 900;
    height: calc(52px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 0.6rem 0;
    background: var(--title-grad); border-bottom: 1px solid var(--title-border);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 2px 6px rgba(0, 0, 0, 0.35);
    color: var(--title-text); text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
  }
  .topbar .site-name { flex: 1; min-width: 0; text-align: left; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .site-name small { color: inherit; opacity: 0.8; }
  .topbar .close-btn { width: 40px; height: 34px; font-size: 1.2rem; }
  .drawer {
    display: none; position: fixed; top: calc(52px + env(safe-area-inset-top)); left: 0; right: 0; z-index: 899;
    max-height: calc(100dvh - 52px); overflow-y: auto;
    padding: 0.75rem; background: var(--side-bg); border-bottom: 1px solid var(--side-border);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
  }
  .drawer.open { display: block; }
  .drawer .themes { margin-top: 0.75rem; }
  .mobile-slider { display: block; max-width: 420px; margin: 0 auto 1rem; }
  .window-body { padding: 0.9rem 0.95rem 1rem; }
  .blog-tile { grid-template-columns: 1fr; gap: 0.5rem; }
  .blog-tile-excerpt { -webkit-line-clamp: 3; }
  .reader { padding: 0; }
  .reader .window { width: 100%; border-radius: 0; border: 0; }
  .reader-body { padding: 1rem 1rem 2rem; text-align: left; }
}
@media (prefers-reduced-motion: reduce) {
  .content { scroll-behavior: auto; }
  .slider-frame img { transition: none; }
}
</style>

</header>
<nav class="drawer" id="drawer">
  <ul class="menu" id="mobile-menu"></ul>
  <div class="themes" data-themes></div>
</nav>

<div class="layout">
  <!-- Bureau : colonne de gauche -->
  <aside class="sidebar">
    <div class="slider" id="desktop-slider"></div>
    <p class="site-name" id="sidebar-name"></p>
    <ul class="menu" id="desktop-menu"></ul>
    <div class="themes" data-themes></div>
  </aside>
  <!-- Contenu : une fenêtre par fichier .md listé dans config.ini -->
  <main class="content" id="content"></main>
</div>

<!-- Fenêtre d'article du blog -->
<div class="reader" id="reader" role="dialog" aria-modal="true">
  <div class="window">
    <div class="titlebar">
      <span class="pill" id="reader-pill">✎</span>
      <h2 id="reader-title"></h2>
      <button class="close-btn" id="reader-close" type="button" title="Retour (Échap)">✕</button>
    </div>
    <div class="reader-body" id="reader-body"></div>
  </div>
</div>

<script>
/* =====================================================================
   COMMENT LE SITE SE MET À JOUR (inchangé)
   - config.ini, [files] list = noms des fichiers .md, dans l'ordre du menu
   - dans chaque .md : « ## Titre » = titre de la rubrique (et du menu),
     « ### » = sous-titre, « #### Titre » = un article du blog (une carte)
   - config.ini, [images] range = 1-3 -> photos 1.jpg, 2.jpg, 3.jpg
   Nouveau, facultatif : [images] list = a.jpg, b.png (noms libres)
   et [site] nom = ..., sous_titre = ..., theme = sombre | clair | beige
   ===================================================================== */

// Pas de zoom à deux doigts ni Ctrl+molette (comme avant)
document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

const IS_LOCAL = /^(localhost|127\.0\.0\.1|)$/.test(location.hostname) || location.protocol === 'file:';
const warnings = [];
const CONFIG = { images: [], files: [], site: {} };
const sections = [];
const posts = [];

/* ---------- config.ini ---------- */
function parseIni(text) {
  let current = '';
  text.split(/\r?\n/).forEach((raw) => {
    const line = raw.trim();
    if (!line || line.startsWith('#') || line.startsWith(';')) return;
    if (line.startsWith('[') && line.endsWith(']')) { current = line.slice(1, -1).trim().toLowerCase(); return; }
    const eq = line.indexOf('=');
    if (eq < 0) return;
    const key = line.slice(0, eq).trim().toLowerCase();
    const value = line.slice(eq + 1).trim();
    if (!key || !value) return;
    if (current === 'images' && key === 'range') {
      const m = value.match(/(\d+)\s*-\s*(\d+)/);
      if (m) for (let i = +m[1]; i <= +m[2]; i++) CONFIG.images.push(`${i}.jpg`);
    } else if (current === 'images' && key === 'list') {
      CONFIG.images.push(...value.split(',').map((s) => s.trim()).filter(Boolean));
    } else if (current === 'files' && key === 'list') {
      CONFIG.files = value.split(',').map((s) => s.trim().replace(/\.md$/i, '')).filter(Boolean);
    } else if (current === 'site') {
      CONFIG.site[key] = value;
    }
  });
}

/* ---------- Markdown ---------- */
const slugify = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 60).replace(/^-+|-+$/g, '') || 'article';

function textOf(html) {
  const div = document.createElement('div');
  div.innerHTML = html;
  return (div.textContent || '').replace(/\s+/g, ' ').trim();
}

// « **Article : 24/11/2025 |** » en tête d'article -> badge ARTICLE + date
function postMeta(lines) {
  const first = lines.find((l) => l.trim());
  if (!first) return { kind: '', date: '', skip: -1 };
  const m = first.trim().match(/^\*\*\s*([^:*|]+?)\s*:\s*(.*?)\s*\|?\s*\*\*\s*$/);
  if (!m) return { kind: '', date: '', skip: -1 };
  const date = (m[2].match(/\d{1,2}\/\d{1,2}\/\d{2,4}/) || [''])[0];
  return { kind: m[1].trim(), date, skip: lines.indexOf(first) };
}

function parseSection(fileName, index, text) {
  const titleMatch = text.match(/^##\s+(.+)$/m);
  const title = titleMatch ? titleMatch[1].trim() : fileName;
  const body = text.replace(/^##\s+.+$/m, '');
  const lines = body.split(/\r?\n/);
  const intro = [];
  const sectionPosts = [];
  let current = null;
  lines.forEach((line) => {
    const m = line.match(/^####\s+(.+)$/);
    if (m) { current = { title: m[1].trim(), lines: [] }; sectionPosts.push(current); }
    else if (current) current.lines.push(line);
    else intro.push(line);
  });
  const id = `section-${index + 1}`;
  const used = new Set(posts.map((p) => p.slug));
  const builtPosts = sectionPosts.map((p) => {
    const meta = postMeta(p.lines);
    const forExcerpt = meta.skip >= 0 ? p.lines.filter((_, i) => i !== meta.skip).join('\n') : p.lines.join('\n');
    const bodyHtml = marked.parse(forExcerpt);
    const metaHtml = meta.skip >= 0
      ? `<p class="reader-meta"><span class="badge ${/vid[ée]o/i.test(meta.kind) ? 'video' : ''}">${esc(meta.kind)}</span>${meta.date ? `<span>${esc(meta.date)}</span>` : ''}</p>`
      : '';
    const html = metaHtml + bodyHtml;
    const plain = textOf(bodyHtml);
    let slug = slugify(p.title);
    for (let n = 2; used.has(slug); n++) slug = `${slugify(p.title)}-${n}`;
    used.add(slug);
    const post = { title: p.title, html, excerpt: plain.length > 220 ? plain.slice(0, 220).replace(/\s+\S*$/, '') + '…' : plain, kind: meta.kind, date: meta.date, slug };
    posts.push(post);
    return post;
  });
  return { id, title, html: marked.parse(intro.join('\n')), posts: builtPosts };
}

async function loadFile(name, index) {
  try {
    const res = await fetch(`${name}.md`, { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    return parseSection(name, index, await res.text());
  } catch (e) {
    warnings.push(`Le fichier « ${name}.md » est listé dans config.ini mais n'a pas pu être lu.`);
    return null;
  }
}

/* ---------- Affichage ---------- */
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function buildSlider(container) {
  if (!CONFIG.images.length) return;
  container.innerHTML = `
    <div class="slider-frame">${CONFIG.images.map((src, i) => `<img src="${esc(src)}" alt="Photo ${i + 1}" ${i ? 'loading="lazy"' : ''} class="${i ? '' : 'active'}">`).join('')}</div>
    ${CONFIG.images.length > 1 ? `<div class="slider-bar">
      <button class="w7-btn" type="button" data-step="-1" aria-label="Photo précédente">‹</button>
      <div class="dots">${CONFIG.images.map((_, i) => `<button type="button" class="dot ${i ? '' : 'active'}" data-go="${i}" aria-label="Photo ${i + 1}"></button>`).join('')}</div>
      <button class="w7-btn" type="button" data-step="1" aria-label="Photo suivante">›</button>
    </div>` : ''}`;
  const imgs = container.querySelectorAll('.slider-frame img');
  const dots = container.querySelectorAll('.dot');
  let pos = 0;
  const show = (n) => {
    pos = (n + imgs.length) % imgs.length;
    imgs.forEach((img, i) => img.classList.toggle('active', i === pos));
    dots.forEach((d, i) => d.classList.toggle('active', i === pos));
  };
  let timer = setInterval(() => show(pos + 1), 6000);
  container.addEventListener('click', (e) => {
    const b = e.target.closest('[data-step],[data-go]');
    if (!b) return;
    clearInterval(timer);
    show(b.dataset.go !== undefined ? +b.dataset.go : pos + +b.dataset.step);
    timer = setInterval(() => show(pos + 1), 6000);
  });
}

function buildMenus() {
  const items = sections.map((s, i) => `<li><a class="w7-btn" href="#${s.id}" data-section="${s.id}" target="_self"><span class="num">${i + 1}</span>${esc(s.title)}</a></li>`).join('');
  document.getElementById('desktop-menu').innerHTML = items;
  document.getElementById('mobile-menu').innerHTML = items;
}

function tileHtml(post) {
  const isVideo = /vid[ée]o/i.test(post.kind);
  return `
    <button class="blog-tile" type="button" data-post="${post.slug}">
      <span class="blog-tile-head">
        <span class="blog-tile-title">${esc(post.title)}</span>
        <span class="blog-tile-meta">${post.kind ? `<span class="badge ${isVideo ? 'video' : ''}">${esc(post.kind)}</span>` : ''}${post.date ? `<span>${esc(post.date)}</span>` : ''}</span>
      </span>
      <span class="blog-tile-excerpt">${esc(post.excerpt)}</span>
      <span class="w7-btn blog-tile-read">Lire ›</span>
    </button>`;
}

function buildContent() {
  const html = sections.map((s, i) => `
    <section class="section" id="${s.id}">
      <div class="window">
        <div class="titlebar"><span class="pill">${i + 1}</span><h2>${esc(s.title)}</h2></div>
        ${i === 0 ? '<div class="window-body slider mobile-slider" id="mobile-slider"></div>' : ''}
        <div class="window-body">${s.html}</div>
      </div>
      ${s.posts.length ? `<div class="blog-tiles">${s.posts.map(tileHtml).join('')}</div>` : ''}
    </section>`).join('');
  const warn = IS_LOCAL && warnings.length ? `<div class="local-warning"><strong>À vérifier (visible seulement en local) :</strong><br>${warnings.map(esc).join('<br>')}</div>` : '';
  document.getElementById('content').innerHTML = warn + html;
}

/* ---------- Navigation ---------- */
const content = document.getElementById('content');
const drawer = document.getElementById('drawer');
const menuToggle = document.getElementById('menu-toggle');
const isMobile = () => window.matchMedia('(max-width: 800px)').matches;

function setActive(id) {
  document.querySelectorAll('[data-section]').forEach((a) => a.classList.toggle('primary', a.dataset.section === id));
}

function openDrawer(open) {
  drawer.classList.toggle('open', open);
  menuToggle.setAttribute('aria-expanded', String(open));
  menuToggle.textContent = open ? '✕' : '☰';
}
menuToggle.addEventListener('click', () => openDrawer(!drawer.classList.contains('open')));

document.addEventListener('click', (e) => {
  const link = e.target.closest('[data-section]');
  if (!link) return;
  e.preventDefault();
  const target = document.getElementById(link.dataset.section);
  if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  setActive(link.dataset.section);
  openDrawer(false);
});

// Rubrique visible -> bouton du menu en bleu
function watchSections() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((en) => { if (en.isIntersecting) setActive(en.target.id); });
  }, { root: isMobile() ? null : content, rootMargin: '-20% 0px -70% 0px' });
  document.querySelectorAll('.section').forEach((s) => observer.observe(s));
}

/* ---------- Thèmes ---------- */
const THEMES = [['clair', 'Clair'], ['beige', 'Beige'], ['sombre', 'Sombre']];
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.querySelectorAll('[data-theme-btn]').forEach((b) => b.classList.toggle('primary', b.dataset.themeBtn === theme));
}
function buildThemeButtons() {
  document.querySelectorAll('[data-themes]').forEach((box) => {
    box.innerHTML = THEMES.map(([k, label]) => `<button class="w7-btn" type="button" data-theme-btn="${k}">${label}</button>`).join('');
  });
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-theme-btn]');
    if (!b) return;
    applyTheme(b.dataset.themeBtn);
    try { localStorage.setItem('site-theme', b.dataset.themeBtn); } catch (err) {}
  });
}

/* ---------- Fenêtre d'article (adresse partageable : …/#article-titre) ---------- */
const reader = document.getElementById('reader');
const readerBody = document.getElementById('reader-body');
let openSlug = null;

function showPost(slug) {
  const post = posts.find((p) => p.slug === slug);
  if (!post) return false;
  openSlug = slug;
  document.getElementById('reader-title').textContent = post.title;
  document.getElementById('reader-pill').textContent = /vid[ée]o/i.test(post.kind) ? '▶' : '✎';
  readerBody.innerHTML = post.html;
  readerBody.scrollTop = 0;
  reader.classList.add('open');
  document.body.classList.add('reading');
  document.getElementById('reader-close').focus({ preventScroll: true });
  return true;
}
function hidePost() {
  if (!openSlug) return;
  openSlug = null;
  reader.classList.remove('open');
  document.body.classList.remove('reading');
  readerBody.innerHTML = ''; // arrête la vidéo
}
function closeReader() {
  if (!openSlug) return;
  if (history.state && history.state.article) history.back(); // le bouton « retour » du téléphone fait pareil
  else { hidePost(); history.replaceState(null, '', location.pathname + location.search); }
}

document.addEventListener('click', (e) => {
  const tile = e.target.closest('[data-post]');
  if (!tile) return;
  if (showPost(tile.dataset.post)) history.pushState({ article: tile.dataset.post }, '', `#article-${tile.dataset.post}`);
});
document.getElementById('reader-close').addEventListener('click', closeReader);
reader.addEventListener('click', (e) => { if (e.target === reader) closeReader(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (openSlug) closeReader(); else openDrawer(false); }
});
window.addEventListener('popstate', () => {
  const m = location.hash.match(/^#article-(.+)$/);
  if (m) showPost(decodeURIComponent(m[1])); else hidePost();
});

/* ---------- Démarrage ---------- */
document.addEventListener('DOMContentLoaded', async () => {
  buildThemeButtons();
  try {
    const res = await fetch('config.ini', { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    parseIni(await res.text());
  } catch (e) {
    content.innerHTML = '<div class="local-warning">Erreur : le fichier config.ini est introuvable.</div>';
    return;
  }
  // Thème par défaut du site (config.ini, [site] theme = ...), si le visiteur n'en a pas choisi
  let saved = null;
  try { saved = localStorage.getItem('site-theme'); } catch (e) {}
  applyTheme(saved || ['clair', 'beige', 'sombre'].find((t) => t === CONFIG.site.theme) || 'sombre');

  const results = await Promise.all(CONFIG.files.map(loadFile));
  sections.push(...results.filter(Boolean));

  const name = CONFIG.site.nom || 'Andrianaivo Mampianina Christian';
  const sub = CONFIG.site.sous_titre || '';
  ['sidebar-name', 'topbar-name'].forEach((id) => {
    document.getElementById(id).innerHTML = esc(name) + (sub ? `<small>${esc(sub)}</small>` : '');
  });

  buildMenus();
  buildContent();
  buildSlider(document.getElementById('desktop-slider'));
  const mobileSlider = document.getElementById('mobile-slider');
  if (mobileSlider) buildSlider(mobileSlider);
  if (sections[0]) setActive(sections[0].id);
  watchSections();

  // Lien direct vers un article (…/#article-titre)
  const m = location.hash.match(/^#article-(.+)$/);
  if (m) {
    const slug = decodeURIComponent(m[1]);
    history.replaceState(null, '', location.pathname + location.search);
    if (posts.some((p) => p.slug === slug)) {
      history.pushState({ article: slug }, '', `#article-${slug}`);
      showPost(slug);
    }
  }
});
</script>
</body>
</html>
